aid: nuvaira
name: Nuvaira
description: 'Nuvaira, Inc. is a privately held medical device company headquartered in
  Minneapolis, Minnesota, founded in 2008 to treat overactive airway nerves in people living
  with chronic obstructive pulmonary disease (COPD). Its dNerva Lung Denervation System is a
  catheter-based, radiofrequency device used in a bronchoscopic procedure called Targeted Lung
  Denervation (TLD), which the FDA has designated a Breakthrough Device. The company holds more
  than 70 issued and pending patents worldwide, has treated over 500 patients across its
  AIRFLOW clinical program, and is currently running the pivotal AIRFLOW-3 trial. Nuvaira sells
  a regulated physical therapeutic device to hospitals and interventional pulmonologists; it
  publishes no developer program, public API, SDK, or machine-readable API contract.'
